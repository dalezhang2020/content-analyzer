      <g class="s03-circle-g" transform="translate(960, 600)">

          <circle class="s03-p-halo" cx="280" cy="0" r="28" fill="#fbbf24" opacity="0.4" filter="url(#s03-glow-strong)"/>

        <!-- cos segment (amber on x-axis) -->

      </g>
    </svg>

    <!-- Caption -->

    <style>

    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = '#scene-03-c185b8';
      const R = 280;

      // Atmosphere
      tl.fromTo(ID + ' .s03-bg', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0);
      tl.fromTo(ID + ' .s03-orb-a', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.5, transformOrigin: 'center' }, 0);
      tl.fromTo(ID + ' .s03-orb-b', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.7, transformOrigin: 'center' }, 0.2);

      // Header
      tl.fromTo(ID + ' .s03-num', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)', transformOrigin: 'center' }, 0.3);
      tl.fromTo(ID + ' .s03-bar', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'power3.out', transformOrigin: 'left' }, 0.45);
      tl.fromTo(ID + ' .s03-label', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5 }, 0.55);
      tl.fromTo(ID + ' .s03-t1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.6);
      tl.fromTo(ID + ' .s03-t2', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: 'expo.out' }, 0.85);
      tl.fromTo(ID + ' .s03-subtitle', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, 1.4);

      // Circle + axes
      tl.fromTo(ID + ' .s03-halo', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, transformOrigin: 'center' }, 1.4);
      tl.fromTo(ID + ' .s03-ax-x', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power3.out', transformOrigin: '960px 600px' }, 1.6);
      tl.fromTo(ID + ' .s03-ax-y', { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: 'power3.out', transformOrigin: '960px 600px' }, 1.7);
      tl.fromTo(ID + ' .s03-arr-x', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.3);
      tl.fromTo(ID + ' .s03-arr-y', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.4);
      tl.fromTo(ID + ' .s03-origin', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)', transformOrigin: 'center' }, 2.0);
      tl.fromTo(ID + ' .s03-unit', { strokeDashoffset: 1760 }, { strokeDashoffset: 0, duration: 1.5, ease: 'power2.inOut' }, 2.0);

      // Readout appears
      tl.fromTo(ID + ' .s03-readout', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 2.6);

      // Rotation: 0 → 2π over 7 seconds (3.2s to 10.2s)
      const state = { theta: 0 };
      tl.to(state, {
        theta: Math.PI * 2,
        duration: 7.0,
        ease: 'none',
        onUpdate: () => {
          const t = state.theta;
          const cx = Math.cos(t) * R;
          const cy = -Math.sin(t) * R; // SVG y inverted
          const rotor = document.querySelector(ID + ' .s03-rotor');
          if (rotor) rotor.setAttribute('transform', 'rotate(' + (-t * 180 / Math.PI) + ')');
          // Update segment endpoints
          const cosSeg = document.querySelector(ID + ' .s03-cos-seg');
          const sinSeg = document.querySelector(ID + ' .s03-sin-seg');
          if (cosSeg) cosSeg.setAttribute('x2', cx.toFixed(2));
          if (sinSeg) { sinSeg.setAttribute('x2', cx.toFixed(2)); sinSeg.setAttribute('y2', cy.toFixed(2)); }
          // Update drop lines inside rotor (they rotate with it)
          // Actually with rotor rotating, drops need special handling:
          const dropX = document.querySelector(ID + ' .s03-drop-x');
          const dropY = document.querySelector(ID + ' .s03-drop-y');
          // reset x2 of drops back to R (local coords before rotation)
          if (dropX) { dropX.setAttribute('x1', String(R)); dropX.setAttribute('y1', '0'); dropX.setAttribute('x2', String(R)); dropX.setAttribute('y2', '0'); }
          if (dropY) { dropY.setAttribute('x1', String(R)); dropY.setAttribute('y1', '0'); dropY.setAttribute('x2', String(R)); dropY.setAttribute('y2', '0'); }

          // Angle arc
          const arc = document.querySelector(ID + ' .s03-arc');
          if (arc) {
            const rArc = 60;
            const endX = Math.cos(t) * rArc;
            const endY = -Math.sin(t) * rArc;
            const largeArc = t > Math.PI ? 1 : 0;
            arc.setAttribute('d', 'M ' + rArc + ' 0 A ' + rArc + ' ' + rArc + ' 0 ' + largeArc + ' 0 ' + endX.toFixed(2) + ' ' + endY.toFixed(2));
          }
          // Arc label position (bisect)
          const arcLbl = document.querySelector(ID + ' .s03-arc-lbl');
          if (arcLbl) {
            const bisect = t / 2;
            const rLbl = 96;
            arcLbl.setAttribute('x', (Math.cos(bisect) * rLbl).toFixed(2));
            arcLbl.setAttribute('y', (-Math.sin(bisect) * rLbl + 10).toFixed(2));
          }
          // Readout
          const thetaEl = document.querySelector(ID + ' .s03-r-theta-val');
          const cosEl = document.querySelector(ID + ' .s03-r-cos-val');
          const sinEl = document.querySelector(ID + ' .s03-r-sin-val');
          if (thetaEl) thetaEl.textContent = t.toFixed(2);
          const fmt = n => (n >= 0 ? '+' : '') + n.toFixed(3);
          if (cosEl) cosEl.textContent = fmt(Math.cos(t));
          if (sinEl) sinEl.textContent = fmt(Math.sin(t));
        }
      }, 3.2);

      // Arc label fades in
      tl.to(ID + ' .s03-arc-lbl', { opacity: 1, duration: 0.5 }, 3.5);

      // Caption at the end
      tl.fromTo(ID + ' .s03-caption', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 10.3);
      tl.fromTo(ID + ' .s03-cap-dot', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'back.out(2)', transformOrigin: 'center' }, 10.5);

      tl.set({}, {}, 12);
      window.__timelines['scene-03-c185b8'] = tl;
    </script>
  </div>
</template>
