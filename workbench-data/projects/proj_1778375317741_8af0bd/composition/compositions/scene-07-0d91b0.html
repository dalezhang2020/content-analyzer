    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = '#scene-07-0d91b0';

      tl.fromTo(ID + ' .s07-bg', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0);
      tl.fromTo(ID + ' .s07-grid-floor', { opacity: 0 }, { opacity: 0.4, duration: 1.5 }, 0.1);
      tl.fromTo(ID + ' .s07-orb-a', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.5, transformOrigin: 'center' }, 0);
      tl.fromTo(ID + ' .s07-orb-b', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.7, transformOrigin: 'center' }, 0.2);

      tl.fromTo(ID + ' .s07-num', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)', transformOrigin: 'center' }, 0.3);
      tl.fromTo(ID + ' .s07-bar', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, transformOrigin: 'left' }, 0.45);
      tl.fromTo(ID + ' .s07-label', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.55);
      tl.fromTo(ID + ' .s07-t1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.6);
      tl.fromTo(ID + ' .s07-t2', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: 'expo.out' }, 0.85);
      tl.fromTo(ID + ' .s07-subtitle', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, 1.4);

      // Counter slides in
      tl.fromTo(ID + ' .s07-counter', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.9, ease: 'power3.out' }, 1.2);

      // Circle
      tl.fromTo(ID + ' .s07-halo', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, transformOrigin: 'center' }, 1.8);
      tl.fromTo(ID + ' .s07-ax-h, ' + ID + ' .s07-ax-v', { opacity: 0 }, { opacity: 0.6, duration: 0.6 }, 2.0);
      tl.fromTo(ID + ' .s07-unit-ellipse', { strokeDashoffset: 950 }, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, 2.2);
      tl.fromTo(ID + ' .s07-circle-lbl', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.2);
      tl.to(ID + ' .s07-mark', { opacity: 1, duration: 0.3, stagger: 0.1 }, 3.0);
      tl.to(ID + ' .s07-mark-lbl', { opacity: 0.9, duration: 0.4, stagger: 0.1 }, 3.2);

      // Time axis extends
      tl.to(ID + ' .s07-time-ax', { opacity: 0.85, duration: 0.6 }, 3.4);
      tl.to(ID + ' .s07-time-arr', { opacity: 1, duration: 0.4 }, 4.0);
      tl.to(ID + ' .s07-time-lbl', { opacity: 1, duration: 0.4 }, 4.1);

      // Rotor reveals
      tl.to(ID + ' .s07-radius', { opacity: 0.9, duration: 0.4 }, 3.8);
      tl.to(ID + ' .s07-p-halo', { opacity: 1, duration: 0.5 }, 3.9);
      tl.to(ID + ' .s07-p', { opacity: 1, duration: 0.5, ease: 'back.out(2)' }, 4.0);
      tl.to(ID + ' .s07-trace-dot', { opacity: 1, duration: 0.4 }, 4.2);

      // Driver: 4 full rotations over 7s; update counter and helix trace
      const state = { phase: 0 };
      tl.to(state, {
        phase: Math.PI * 8,
        duration: 7.0,
        ease: 'none',
        onUpdate: () => {
          const p = state.phase;
          const theta = p;
          // Rotor on tilted ellipse
          const cx = Math.cos(theta) * 210;
          const cy = Math.sin(theta) * 80;
          const rotor = document.querySelector(ID + ' .s07-rotor');
          if (rotor) {
            const rad = rotor.querySelector('.s07-radius');
            const pt = rotor.querySelector('.s07-p');
            const halo = rotor.querySelector('.s07-p-halo');
            if (rad) { rad.setAttribute('x2', cx.toFixed(2)); rad.setAttribute('y2', cy.toFixed(2)); }
            if (pt) { pt.setAttribute('cx', cx.toFixed(2)); pt.setAttribute('cy', cy.toFixed(2)); }
            if (halo) { halo.setAttribute('cx', cx.toFixed(2)); halo.setAttribute('cy', cy.toFixed(2)); }
          }

          // Trace dot on helix
          const progress = Math.min(1, p / (Math.PI * 8));
          const hx = progress * 1080;
          const localT = p % (Math.PI * 2);
          const hy = -Math.sin(localT) * 160;
          const dot = document.querySelector(ID + ' .s07-trace-dot');
          if (dot) { dot.setAttribute('cx', hx.toFixed(2)); dot.setAttribute('cy', hy.toFixed(2)); }

          // Counter
          const n = Math.floor(p / (Math.PI * 2));
          const cv = document.querySelector(ID + ' .s07-cycle-val');
          const pv = document.querySelector(ID + ' .s07-phase-val');
          if (cv) cv.textContent = String(n);
          if (pv) pv.textContent = p.toFixed(2);
        }
      }, 4.3);

      // Helix path draws
      tl.to(ID + ' .s07-helix-path', { strokeDashoffset: 0, duration: 6.6, ease: 'power1.inOut' }, 4.5);

      // Cycle markers fade in progressively
      tl.to(ID + ' .s07-cm-1', { opacity: 0.85, duration: 0.4 }, 5.2);
      tl.to(ID + ' .s07-cm-lbl-1', { opacity: 1, duration: 0.4 }, 5.4);
      tl.to(ID + ' .s07-cm-2', { opacity: 0.85, duration: 0.4 }, 6.8);
      tl.to(ID + ' .s07-cm-lbl-2', { opacity: 1, duration: 0.4 }, 7.0);
      tl.to(ID + ' .s07-cm-3', { opacity: 0.85, duration: 0.4 }, 8.4);
      tl.to(ID + ' .s07-cm-lbl-3', { opacity: 1, duration: 0.4 }, 8.6);
      tl.to(ID + ' .s07-cm-4', { opacity: 0.85, duration: 0.4 }, 10.0);
      tl.to(ID + ' .s07-cm-lbl-4', { opacity: 1, duration: 0.4 }, 10.2);

      tl.to(ID + ' .s07-helix-lbl', { opacity: 1, duration: 0.6 }, 10.5);

      // Caption
      tl.fromTo(ID + ' .s07-caption', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 11.4);
      tl.fromTo(ID + ' .s07-cap-dot', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'back.out(2)', transformOrigin: 'center' }, 11.6);

      tl.set({}, {}, 13);
      window.__timelines['scene-07-0d91b0'] = tl;
    </script>
