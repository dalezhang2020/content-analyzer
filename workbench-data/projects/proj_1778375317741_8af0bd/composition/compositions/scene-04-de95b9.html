<template id="scene-04-de95b9-template">
  <div id="scene-04-de95b9" data-composition-id="scene-04-de95b9" data-width="1920" data-height="1080">

    <div class="s04-bg"></div>
    <div class="s04-vignette"></div>
    <div class="s04-orb s04-orb-a"></div>
    <div class="s04-orb s04-orb-b"></div>

    <div class="s04-header">
      <div class="s04-eyebrow">
        <span class="s04-num">04</span>
        <span class="s04-bar"></span>
        <span class="s04-label">CIRCLE → WAVE</span>
      </div>
      <h1 class="s04-title">
        <span class="s04-t1">把圆</span>
        <span class="s04-t2">展开成波</span>
      </h1>
      <div class="s04-subtitle">纵坐标 → <span class="s04-em-sin">正弦波</span> · 横坐标 → <span class="s04-em-cos">余弦波</span></div>
    </div>

    <svg class="s04-stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="s04-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="s04-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4dd0ff" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#4dd0ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="s04-sin-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff4d8f" stop-opacity="0.2"/>
          <stop offset="30%" stop-color="#ff4d8f" stop-opacity="1"/>
          <stop offset="100%" stop-color="#c4b5fd" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="s04-cos-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
          <stop offset="30%" stop-color="#fbbf24" stop-opacity="1"/>
          <stop offset="100%" stop-color="#ffb36e" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- Left: unit circle -->
      <g class="s04-circle-g" transform="translate(360, 620)">
        <circle class="s04-halo" cx="0" cy="0" r="240" fill="url(#s04-halo)"/>
        <line class="s04-ax-x" x1="-220" y1="0" x2="220" y2="0" stroke="#5b6e93" stroke-width="1.5"/>
        <line class="s04-ax-y" x1="0" y1="220" x2="0" y2="-220" stroke="#5b6e93" stroke-width="1.5"/>
        <circle class="s04-unit" cx="0" cy="0" r="180" fill="none" stroke="#4dd0ff" stroke-width="3"
                stroke-dasharray="1131" stroke-dashoffset="1131" filter="url(#s04-glow)"/>
        <line class="s04-radius" x1="0" y1="0" x2="180" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
        <circle class="s04-p-halo" cx="180" cy="0" r="20" fill="#fbbf24" opacity="0.4" filter="url(#s04-glow)"/>
        <circle class="s04-p" cx="180" cy="0" r="10" fill="#fbbf24" stroke="#fffbeb" stroke-width="2"/>
        <text class="s04-circle-lbl" x="0" y="260" fill="#8da1c7" font-size="20" text-anchor="middle" letter-spacing="4">单位圆</text>
      </g>

      <!-- Arrow from circle to wave (transition indicator) -->
      <g class="s04-arrow-g" transform="translate(620, 620)">
        <line class="s04-arrow-line" x1="0" y1="0" x2="100" y2="0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" opacity="0"/>
        <polygon class="s04-arrow-head" points="100,0 80,-8 80,8" fill="#fbbf24" opacity="0"/>
        <text class="s04-arrow-lbl" x="50" y="-18" fill="#fbbf24" font-size="18" text-anchor="middle" letter-spacing="2" opacity="0">展开</text>
      </g>

      <!-- Right: wave panel -->
      <g class="s04-wave-g" transform="translate(740, 620)">
        <line class="s04-wave-ax" x1="0" y1="0" x2="1100" y2="0" stroke="#5b6e93" stroke-width="1.5" opacity="0"/>
        <line class="s04-wave-amp" x1="0" y1="-200" x2="0" y2="200" stroke="#3a4a70" stroke-width="1" stroke-dasharray="4 4" opacity="0"/>
        <polygon class="s04-time-arr" points="1100,0 1080,-8 1080,8" fill="#5b6e93" opacity="0"/>
        <text class="s04-time-lbl" x="1080" y="-18" fill="#8da1c7" font-size="18" text-anchor="end" letter-spacing="2" opacity="0">时间 t →</text>
        <text class="s04-amp-plus" x="-16" y="-194" fill="#5b6e93" font-size="16" text-anchor="end" font-family="JetBrains Mono, monospace" opacity="0">+1</text>
        <text class="s04-amp-minus" x="-16" y="210" fill="#5b6e93" font-size="16" text-anchor="end" font-family="JetBrains Mono, monospace" opacity="0">-1</text>

        <!-- Sine wave: 3 cycles across 1100px, amplitude 180 -->
        <path class="s04-sin-wave"
              d="M 0 0 Q 46 -180, 92 -180 T 184 0 T 276 180 T 368 180 T 460 0 T 552 -180 T 644 -180 T 736 0 T 828 180 T 920 180 T 1012 0 T 1100 -140"
              fill="none" stroke="url(#s04-sin-grad)" stroke-width="4" stroke-linecap="round"
              stroke-dasharray="1800" stroke-dashoffset="1800" filter="url(#s04-glow)"/>
        <!-- Cosine wave: shifted 90° -->
        <path class="s04-cos-wave"
              d="M 0 -180 Q 46 -180, 92 0 T 184 180 T 276 180 T 368 0 T 460 -180 T 552 -180 T 644 0 T 736 180 T 828 180 T 920 0 T 1012 -180 T 1100 -180"
              fill="none" stroke="url(#s04-cos-grad)" stroke-width="3.5" stroke-linecap="round"
              stroke-dasharray="1800" stroke-dashoffset="1800" opacity="0.9"/>

        <text class="s04-sin-lbl" x="30" y="-200" fill="#ff4d8f" font-size="26" font-style="italic" font-family="Georgia, serif" opacity="0">sin θ</text>
        <text class="s04-cos-lbl" x="30" y="230" fill="#fbbf24" font-size="26" font-style="italic" font-family="Georgia, serif" opacity="0">cos θ</text>
      </g>
    </svg>

    <div class="s04-caption">
      <span class="s04-cap-dot"></span>
      <span class="s04-cap-accent">旋转</span> &times; <span class="s04-cap-accent2">时间</span> = <span class="s04-cap-accent3">波形曲线</span>
    </div>

    <style>
      #scene-04-de95b9 {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #040813; color: #f1f5f9;
        font-family: "PingFang SC", sans-serif;
      }
      #scene-04-de95b9 .s04-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 900px 700px at 22% 45%, rgba(77,208,255,0.16), transparent 58%),
          radial-gradient(ellipse 900px 700px at 78% 62%, rgba(251,191,36,0.12), transparent 58%),
          radial-gradient(ellipse 1100px 800px at 50% 110%, rgba(255,77,143,0.08), transparent 55%),
          linear-gradient(180deg, #040813 0%, #060b20 55%, #030612 100%);
      }
      #scene-04-de95b9 .s04-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
        pointer-events: none;
      }
      #scene-04-de95b9 .s04-orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
      #scene-04-de95b9 .s04-orb-a {
        width: 520px; height: 520px; left: -180px; top: 120px;
        background: radial-gradient(circle, rgba(77,208,255,0.35), transparent 70%);
      }
      #scene-04-de95b9 .s04-orb-b {
        width: 620px; height: 620px; right: -220px; bottom: -200px;
        background: radial-gradient(circle, rgba(251,191,36,0.22), transparent 70%);
      }
      #scene-04-de95b9 .s04-header { position: absolute; top: 88px; left: 128px; z-index: 10; }
      #scene-04-de95b9 .s04-eyebrow {
        display: flex; align-items: center; gap: 18px;
        font-size: 20px; letter-spacing: 0.32em; color: #8da1c7; font-weight: 500;
      }
      #scene-04-de95b9 .s04-num {
        color: #fbbf24; font-family: "JetBrains Mono", monospace; font-size: 22px;
        padding: 4px 10px; border: 1px solid rgba(251,191,36,0.35); border-radius: 4px; letter-spacing: 0.12em;
      }
      #scene-04-de95b9 .s04-bar { display: inline-block; width: 56px; height: 1px; background: linear-gradient(90deg, transparent, #5b6e93, transparent); }
      #scene-04-de95b9 .s04-label { color: #b5c4dd; }
      #scene-04-de95b9 .s04-title {
        margin-top: 18px; font-size: 130px; font-weight: 800; line-height: 1;
        letter-spacing: -0.02em;
        display: flex; gap: 22px; align-items: baseline;
      }
      #scene-04-de95b9 .s04-t1 { color: #d9e4f5; font-weight: 200; }
      #scene-04-de95b9 .s04-t2 {
        background: linear-gradient(135deg, #ffffff 0%, #ff4d8f 50%, #fbbf24 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        font-weight: 900;
        text-shadow: 0 0 42px rgba(255,77,143,0.35);
      }
      #scene-04-de95b9 .s04-subtitle {
        margin-top: 20px; font-size: 30px; color: #9fb0cc; letter-spacing: 0.05em; font-weight: 300;
      }
      #scene-04-de95b9 .s04-em-sin { color: #ff4d8f; font-weight: 700; padding: 0 4px; }
      #scene-04-de95b9 .s04-em-cos { color: #fbbf24; font-weight: 700; padding: 0 4px; }

      #scene-04-de95b9 .s04-stage { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

      #scene-04-de95b9 .s04-caption {
        position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 14px;
        font-size: 28px; color: #e2e8f0; letter-spacing: 0.1em; font-weight: 300;
        padding: 16px 36px;
        background: rgba(10,18,36,0.6); border: 1px solid rgba(148,163,184,0.2);
        border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      #scene-04-de95b9 .s04-cap-dot {
        display: inline-block; width: 10px; height: 10px; border-radius: 50%;
        background: #fbbf24; box-shadow: 0 0 12px #fbbf24;
      }
      #scene-04-de95b9 .s04-cap-accent { color: #fbbf24; font-weight: 700; text-shadow: 0 0 14px rgba(251,191,36,0.5); }
      #scene-04-de95b9 .s04-cap-accent2 { color: #4dd0ff; font-weight: 700; text-shadow: 0 0 14px rgba(77,208,255,0.5); }
      #scene-04-de95b9 .s04-cap-accent3 { color: #ff4d8f; font-weight: 700; text-shadow: 0 0 14px rgba(255,77,143,0.5); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = '#scene-04-de95b9';
      const R = 180;

      tl.fromTo(ID + ' .s04-bg', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0);
      tl.fromTo(ID + ' .s04-orb-a', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.5, transformOrigin: 'center' }, 0);
      tl.fromTo(ID + ' .s04-orb-b', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.7, transformOrigin: 'center' }, 0.2);

      tl.fromTo(ID + ' .s04-num', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)', transformOrigin: 'center' }, 0.3);
      tl.fromTo(ID + ' .s04-bar', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, transformOrigin: 'left' }, 0.45);
      tl.fromTo(ID + ' .s04-label', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5 }, 0.55);
      tl.fromTo(ID + ' .s04-t1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.6);
      tl.fromTo(ID + ' .s04-t2', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: 'expo.out' }, 0.85);
      tl.fromTo(ID + ' .s04-subtitle', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7 }, 1.4);

      // Circle appears
      tl.fromTo(ID + ' .s04-halo', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 1.2, transformOrigin: 'center' }, 1.6);
      tl.fromTo(ID + ' .s04-ax-x', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power3.out', transformOrigin: '360px 620px' }, 1.8);
      tl.fromTo(ID + ' .s04-ax-y', { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: 'power3.out', transformOrigin: '360px 620px' }, 1.9);
      tl.fromTo(ID + ' .s04-unit', { strokeDashoffset: 1131 }, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, 2.0);
      tl.fromTo(ID + ' .s04-circle-lbl', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.0);
      tl.fromTo(ID + ' .s04-radius', { opacity: 0, scaleX: 0 }, { opacity: 0.9, scaleX: 1, duration: 0.6, transformOrigin: '360px 620px' }, 3.2);
      tl.fromTo(ID + ' .s04-p-halo', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(2)', transformOrigin: '540px 620px' }, 3.3);
      tl.fromTo(ID + ' .s04-p', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2.5)', transformOrigin: '540px 620px' }, 3.4);

      // Arrow
      tl.to(ID + ' .s04-arrow-line', { opacity: 0.9, duration: 0.5 }, 3.8);
      tl.to(ID + ' .s04-arrow-head', { opacity: 1, duration: 0.4 }, 4.0);
      tl.to(ID + ' .s04-arrow-lbl', { opacity: 1, duration: 0.4 }, 4.1);

      // Wave axes
      tl.to(ID + ' .s04-wave-ax', { opacity: 0.8, duration: 0.6 }, 4.3);
      tl.to(ID + ' .s04-wave-amp', { opacity: 0.5, duration: 0.5 }, 4.5);
      tl.to(ID + ' .s04-time-arr', { opacity: 1, duration: 0.4 }, 5.0);
      tl.to(ID + ' .s04-time-lbl', { opacity: 1, duration: 0.4 }, 5.1);
      tl.to(ID + ' .s04-amp-plus', { opacity: 0.9, duration: 0.4 }, 5.2);
      tl.to(ID + ' .s04-amp-minus', { opacity: 0.9, duration: 0.4 }, 5.3);

      // Rotation + wave drawing in parallel
      const state = { t: 0 };
      tl.to(state, {
        t: Math.PI * 4,
        duration: 7.0,
        ease: 'power1.inOut',
        onUpdate: () => {
          const theta = state.t;
          const cx = Math.cos(theta) * R;
          const cy = -Math.sin(theta) * R;
          const radius = document.querySelector(ID + ' .s04-radius');
          const pt = document.querySelector(ID + ' .s04-p');
          const ptHalo = document.querySelector(ID + ' .s04-p-halo');
          if (radius) { radius.setAttribute('x2', cx.toFixed(2)); radius.setAttribute('y2', cy.toFixed(2)); }
          if (pt) { pt.setAttribute('cx', cx.toFixed(2)); pt.setAttribute('cy', cy.toFixed(2)); }
          if (ptHalo) { ptHalo.setAttribute('cx', cx.toFixed(2)); ptHalo.setAttribute('cy', cy.toFixed(2)); }
        }
      }, 5.0);

      // Waves draw in over 6s
      tl.to(ID + ' .s04-sin-wave', { strokeDashoffset: 0, duration: 6.0, ease: 'power1.inOut' }, 5.0);
      tl.to(ID + ' .s04-cos-wave', { strokeDashoffset: 0, duration: 6.0, ease: 'power1.inOut' }, 5.3);

      // Wave labels
      tl.to(ID + ' .s04-sin-lbl', { opacity: 1, duration: 0.5 }, 6.5);
      tl.to(ID + ' .s04-cos-lbl', { opacity: 1, duration: 0.5 }, 6.9);

      // Caption
      tl.fromTo(ID + ' .s04-caption', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 12.4);
      tl.fromTo(ID + ' .s04-cap-dot', { scale: 0 }, { scale: 1, duration: 0.4, ease: 'back.out(2)', transformOrigin: 'center' }, 12.6);

      tl.set({}, {}, 14);
      window.__timelines['scene-04-de95b9'] = tl;
    </script>
  </div>
</template>
