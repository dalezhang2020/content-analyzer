<template id="scene-06-2d4304-template">
  <div id="scene-06-2d4304" data-composition-id="scene-06-2d4304" data-width="1920" data-height="1080">

    <div class="bg"></div>
    <div class="grid-floor"></div>
    <div class="bg-vignette"></div>

    <div class="eyebrow">第 06 幕 · tan 的几何</div>
    <h1 class="title">tan θ <span class="eq">=</span> <span class="frac">sin θ <span class="bar"></span> cos θ</span></h1>
    <div class="subtitle">= 圆上切线的斜率 · 当 cos&nbsp;→&nbsp;0,tan&nbsp;→&nbsp;∞</div>

    <svg class="stage" viewBox="0 0 1920 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="s06-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="s06-strong" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="10" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="s06-point-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffbeb"/>
          <stop offset="60%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </radialGradient>
        <linearGradient id="s06-tan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f472b6" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#f472b6" stop-opacity="1"/>
          <stop offset="100%" stop-color="#f472b6" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <!-- Left panel: unit circle with tangent line -->
      <g class="circle-panel" transform="translate(460, 360)">
        <line class="axis" x1="-260" y1="0" x2="260" y2="0" stroke="#4a6b99" stroke-width="1.5" opacity="0.6"/>
        <line class="axis" x1="0" y1="-260" x2="0" y2="260" stroke="#4a6b99" stroke-width="1.5" opacity="0.6"/>
        <text class="ax-x" x="268" y="8" fill="#94a3b8" font-size="22" font-style="italic" opacity="0">x</text>
        <text class="ax-y" x="10" y="-260" fill="#94a3b8" font-size="22" font-style="italic" opacity="0">y</text>

        <circle class="unit-circle" cx="0" cy="0" r="220" fill="none"
                stroke="#4dd0ff" stroke-width="3"
                stroke-dasharray="1382" stroke-dashoffset="1382"
                filter="url(#s06-glow)"/>

        <!-- Vertical line x=1 where tangent meets -->
        <line class="tan-rail" x1="220" y1="-380" x2="220" y2="380"
              stroke="#f472b6" stroke-width="2" stroke-dasharray="8 6"
              opacity="0" filter="url(#s06-glow)"/>
        <text class="tan-rail-lbl" x="232" y="-360" fill="#f472b6" font-size="20" opacity="0">x = 1</text>

        <!-- Angle arc -->
        <path class="angle-arc" d="M 60 0 A 60 60 0 0 0 42 -42" fill="none"
              stroke="#fbbf24" stroke-width="2.5" opacity="0"/>
        <text class="angle-label" x="48" y="-22" fill="#fbbf24" font-size="26"
              font-family="Georgia, serif" font-style="italic" opacity="0">θ</text>

        <!-- Radius and extended ray -->
        <line class="radius" x1="0" y1="0" x2="0" y2="0"
              stroke="#a78bfa" stroke-width="3" opacity="0" filter="url(#s06-glow)"/>
        <line class="ray-ext" x1="0" y1="0" x2="0" y2="0"
              stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6" opacity="0"/>

        <!-- Point on circle -->
        <circle class="pt-circle" cx="0" cy="0" r="10" fill="url(#s06-point-glow)"
                filter="url(#s06-strong)" opacity="0"/>

        <!-- Tangent intersection point (x = 1, y = -tan θ) -->
        <circle class="pt-tan" cx="220" cy="0" r="10" fill="#f472b6"
                filter="url(#s06-strong)" opacity="0"/>
        <text class="pt-tan-lbl" x="238" y="-14" fill="#f472b6" font-size="24"
              font-family="Georgia, serif" font-style="italic" font-weight="700" opacity="0">tan θ</text>

        <!-- Projections -->
        <line class="proj-cos" x1="0" y1="0" x2="0" y2="0"
              stroke="#ffb36e" stroke-width="2.2" stroke-dasharray="6 6" opacity="0"/>
        <line class="proj-sin" x1="0" y1="0" x2="0" y2="0"
              stroke="#4dd0ff" stroke-width="2.2" stroke-dasharray="6 6" opacity="0"/>
        <text class="lbl-cos" x="0" y="0" fill="#ffb36e" font-size="22"
              font-style="italic" font-family="Georgia, serif" text-anchor="middle" opacity="0">cos θ</text>

        <text class="lbl-pt" x="0" y="0" fill="#f8fafc" font-size="20"
              font-family="Georgia, serif" text-anchor="start" opacity="0">P(cos θ, sin θ)</text>
      </g>

      <!-- Right panel: tan(θ) curve across θ -->
      <g class="curve-panel" transform="translate(1080, 360)">
        <!-- axes -->
        <line class="ax-curve-x" x1="0" y1="0" x2="760" y2="0" stroke="#5a7bb8" stroke-width="1.6" opacity="0.7"/>
        <line class="ax-curve-y" x1="0" y1="-300" x2="0" y2="300" stroke="#5a7bb8" stroke-width="1.6" opacity="0.7"/>
        <text class="axlbl-curve-x" x="770" y="10" fill="#8ba3c7" font-size="20" font-style="italic" opacity="0">θ</text>
        <text class="axlbl-curve-y" x="10" y="-300" fill="#8ba3c7" font-size="20" font-style="italic" opacity="0">tan θ</text>

        <!-- Asymptote markers at π/2 and 3π/2 -->
        <line class="asym asym-1" x1="190" y1="-300" x2="190" y2="300" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4 6" opacity="0"/>
        <line class="asym asym-2" x1="570" y1="-300" x2="570" y2="300" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4 6" opacity="0"/>
        <text class="asym-lbl-1" x="195" y="290" fill="#ff6b6b" font-size="18" opacity="0">π/2</text>
        <text class="asym-lbl-2" x="575" y="290" fill="#ff6b6b" font-size="18" opacity="0">3π/2</text>

        <!-- tick labels -->
        <text class="tk-0"  x="0"   y="30"  fill="#94a3b8" font-size="16" text-anchor="middle" opacity="0">0</text>
        <text class="tk-pi" x="380" y="30"  fill="#94a3b8" font-size="16" text-anchor="middle" opacity="0">π</text>
        <text class="tk-2pi" x="760" y="30" fill="#94a3b8" font-size="16" text-anchor="middle" opacity="0">2π</text>

        <!-- tan curve (3 segments avoiding asymptotes) -->
        <path class="tan-seg-1"
              d="M 0 0 C 60 -20, 120 -80, 160 -200 C 175 -250, 185 -290, 188 -300"
              fill="none" stroke="url(#s06-tan-grad)" stroke-width="3.5" stroke-linecap="round"
              stroke-dasharray="700" stroke-dashoffset="700"
              filter="url(#s06-glow)"/>
        <path class="tan-seg-2"
              d="M 192 300 C 200 270, 240 120, 380 0 C 520 -120, 560 -270, 568 -300"
              fill="none" stroke="url(#s06-tan-grad)" stroke-width="3.5" stroke-linecap="round"
              stroke-dasharray="1200" stroke-dashoffset="1200"
              filter="url(#s06-glow)"/>
        <path class="tan-seg-3"
              d="M 572 300 C 580 280, 620 180, 700 80 C 740 30, 760 10, 760 0"
              fill="none" stroke="url(#s06-tan-grad)" stroke-width="3.5" stroke-linecap="round"
              stroke-dasharray="700" stroke-dashoffset="700"
              filter="url(#s06-glow)"/>

        <!-- Arrow to infinity -->
        <text class="inf-arrow" x="170" y="-320" fill="#ff6b6b" font-size="26" font-style="italic" opacity="0" text-anchor="middle">→ ∞</text>
      </g>
    </svg>

    <div class="caption">
      <span class="cap-accent">cos → 0</span> 时,<span class="cap-accent2">tan</span> 冲向 <span class="cap-accent3">无穷</span>
    </div>

    <style>
      #scene-06-2d4304 {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070f;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
        color: #e8eef7;
      }
      #scene-06-2d4304 .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 900px 700px at 25% 45%, rgba(77,208,255,0.14), transparent 60%),
          radial-gradient(ellipse 900px 700px at 80% 58%, rgba(244,114,182,0.14), transparent 60%),
          radial-gradient(ellipse 1100px 800px at 50% 110%, rgba(251,191,36,0.09), transparent 55%),
          linear-gradient(180deg, #060913 0%, #0b1128 55%, #030610 100%);
      }
      #scene-06-2d4304 .grid-floor {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(120,160,220,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120,160,220,0.05) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(ellipse 1400px 900px at 50% 55%, #000 30%, transparent 85%);
        -webkit-mask-image: radial-gradient(ellipse 1400px 900px at 50% 55%, #000 30%, transparent 85%);
      }
      #scene-06-2d4304 .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
      }

      #scene-06-2d4304 .eyebrow {
        position: absolute; top: 92px; left: 120px;
        font-size: 26px; letter-spacing: 10px;
        color: #f472b6; font-weight: 500;
      }
      #scene-06-2d4304 .title {
        position: absolute; top: 140px; left: 120px;
        font-size: 92px; font-weight: 800; letter-spacing: 4px;
        color: #f7fafc; line-height: 1.05;
        text-shadow: 0 0 32px rgba(244,114,182,0.3);
        display: flex; align-items: center; gap: 18px;
      }
      #scene-06-2d4304 .title .eq {
        color: #a78bfa; font-weight: 700; margin: 0 6px;
      }
      #scene-06-2d4304 .title .frac {
        display: inline-flex; flex-direction: column; align-items: center;
        font-size: 60px; font-style: italic; font-family: Georgia, serif;
        line-height: 1.1; padding: 0 4px;
      }
      #scene-06-2d4304 .title .frac .bar {
        width: 220px; height: 3px;
        background: #f472b6;
        margin: 4px 0;
        filter: drop-shadow(0 0 8px rgba(244,114,182,0.6));
      }
      #scene-06-2d4304 .subtitle {
        position: absolute; top: 306px; left: 124px;
        font-size: 30px; color: #9fb4cc; letter-spacing: 4px;
      }

      #scene-06-2d4304 .stage {
        position: absolute; left: 0; top: 340px;
        width: 1920px; height: 720px;
      }

      #scene-06-2d4304 .caption {
        position: absolute; left: 50%; bottom: 66px;
        transform: translateX(-50%);
        font-size: 30px; color: #d7e3f2;
        letter-spacing: 6px; font-weight: 300;
        padding: 16px 42px;
        background: rgba(12, 20, 36, 0.6);
        border: 1px solid rgba(244,114,182,0.28);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      #scene-06-2d4304 .cap-accent  { color: #ffb36e; font-weight: 600; text-shadow: 0 0 14px rgba(255,179,110,0.5); }
      #scene-06-2d4304 .cap-accent2 { color: #f472b6; font-weight: 600; text-shadow: 0 0 14px rgba(244,114,182,0.5); }
      #scene-06-2d4304 .cap-accent3 { color: #ff6b6b; font-weight: 700; text-shadow: 0 0 16px rgba(255,107,107,0.6); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = '#scene-06-2d4304';

      // 0 - 1.3s: Atmosphere + title block
      tl.fromTo(ID + ' .bg', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0);
      tl.fromTo(ID + ' .grid-floor', { opacity: 0 }, { opacity: 1, duration: 1.3, ease: 'power2.out' }, 0.1);
      tl.fromTo(ID + ' .eyebrow', { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power2.out' }, 0.25);
      tl.fromTo(ID + ' .title', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.45);
      tl.fromTo(ID + ' .subtitle', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 1.0);

      // 1.4 - 3.0s: left panel axes + unit circle
      tl.fromTo(ID + ' .circle-panel .axis', { opacity: 0 }, { opacity: 0.6, duration: 0.5, stagger: 0.1 }, 1.4);
      tl.to(ID + ' .ax-x', { opacity: 0.85, duration: 0.35 }, 1.65);
      tl.to(ID + ' .ax-y', { opacity: 0.85, duration: 0.35 }, 1.75);
      tl.to(ID + ' .unit-circle', { strokeDashoffset: 0, duration: 1.35, ease: 'power2.inOut' }, 1.7);

      // 3.0 - 3.6s: tangent rail appears (x = 1 vertical)
      tl.to(ID + ' .tan-rail', { opacity: 0.85, duration: 0.55, ease: 'power2.out' }, 3.0);
      tl.to(ID + ' .tan-rail-lbl', { opacity: 1, duration: 0.4 }, 3.4);

      // 3.5 - 5.6s: drive radius angle θ (from 0 to ~60°), show P, cos/sin projections, tan intersection
      const state = { theta: 0 };
      const R = 220;
      tl.to(state, {
        theta: Math.PI / 3, // 60°
        duration: 2.0,
        ease: 'power2.inOut',
        onUpdate: () => {
          const t = state.theta;
          const cx = Math.cos(t) * R;
          const cy = -Math.sin(t) * R;
          // extend ray to x = R (i.e. x/cos = R/cos)
          const scale = R / Math.cos(t);
          const ex = R;
          const ey = -Math.sin(t) * scale;

          const rad = document.querySelector(ID + ' .radius');
          if (rad) { rad.setAttribute('x2', cx.toFixed(2)); rad.setAttribute('y2', cy.toFixed(2)); }
          const ext = document.querySelector(ID + ' .ray-ext');
          if (ext) {
            ext.setAttribute('x1', cx.toFixed(2));
            ext.setAttribute('y1', cy.toFixed(2));
            ext.setAttribute('x2', ex.toFixed(2));
            ext.setAttribute('y2', ey.toFixed(2));
          }
          const pt = document.querySelector(ID + ' .pt-circle');
          if (pt) { pt.setAttribute('cx', cx.toFixed(2)); pt.setAttribute('cy', cy.toFixed(2)); }
          const pt2 = document.querySelector(ID + ' .pt-tan');
          if (pt2) { pt2.setAttribute('cx', ex.toFixed(2)); pt2.setAttribute('cy', ey.toFixed(2)); }

          // projections
          const pcos = document.querySelector(ID + ' .proj-cos');
          if (pcos) {
            pcos.setAttribute('x1', '0'); pcos.setAttribute('y1', '0');
            pcos.setAttribute('x2', cx.toFixed(2)); pcos.setAttribute('y2', '0');
          }
          const psin = document.querySelector(ID + ' .proj-sin');
          if (psin) {
            psin.setAttribute('x1', cx.toFixed(2)); psin.setAttribute('y1', '0');
            psin.setAttribute('x2', cx.toFixed(2)); psin.setAttribute('y2', cy.toFixed(2));
          }
          // labels
          const lc = document.querySelector(ID + ' .lbl-cos');
          if (lc) { lc.setAttribute('x', (cx / 2).toFixed(2)); lc.setAttribute('y', '30'); }
          const lp = document.querySelector(ID + ' .lbl-pt');
          if (lp) { lp.setAttribute('x', (cx + 14).toFixed(2)); lp.setAttribute('y', (cy - 18).toFixed(2)); }
          const ltt = document.querySelector(ID + ' .pt-tan-lbl');
          if (ltt) { ltt.setAttribute('y', (ey - 14).toFixed(2)); }
        }
      }, 3.5);

      // Make elements visible as they take position
      tl.to(ID + ' .radius', { opacity: 1, duration: 0.35 }, 3.4);
      tl.to(ID + ' .angle-arc', { opacity: 1, duration: 0.35 }, 3.8);
      tl.to(ID + ' .angle-label', { opacity: 1, duration: 0.35 }, 3.95);
      tl.to(ID + ' .pt-circle', { opacity: 1, duration: 0.4, ease: 'back.out(2.2)' }, 4.0);
      tl.to(ID + ' .proj-cos', { opacity: 0.85, duration: 0.4 }, 4.25);
      tl.to(ID + ' .lbl-cos',  { opacity: 1, duration: 0.4 }, 4.45);
      tl.to(ID + ' .proj-sin', { opacity: 0.85, duration: 0.4 }, 4.55);
      tl.to(ID + ' .lbl-pt',   { opacity: 1, duration: 0.4 }, 4.75);
      tl.to(ID + ' .ray-ext',  { opacity: 0.85, duration: 0.5 }, 4.9);
      tl.to(ID + ' .pt-tan',   { opacity: 1, duration: 0.4, ease: 'back.out(2.2)' }, 5.2);
      tl.to(ID + ' .pt-tan-lbl', { opacity: 1, duration: 0.4 }, 5.4);

      // 5.6 - 6.6s: Right panel axes + asymptotes
      tl.fromTo(ID + ' .ax-curve-x', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, 5.6);
      tl.fromTo(ID + ' .ax-curve-y', { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.7, ease: 'power2.out' }, 5.75);
      tl.to(ID + ' .axlbl-curve-x', { opacity: 1, duration: 0.35 }, 6.3);
      tl.to(ID + ' .axlbl-curve-y', { opacity: 1, duration: 0.35 }, 6.4);
      tl.to(ID + ' .tk-0',  { opacity: 0.9, duration: 0.35 }, 6.45);
      tl.to(ID + ' .tk-pi', { opacity: 0.9, duration: 0.35 }, 6.55);
      tl.to(ID + ' .tk-2pi', { opacity: 0.9, duration: 0.35 }, 6.65);

      // Asymptotes ignite (highlight the "explode to infinity")
      tl.to(ID + ' .asym-1', { opacity: 0.9, duration: 0.4 }, 6.6);
      tl.to(ID + ' .asym-lbl-1', { opacity: 0.95, duration: 0.35 }, 6.9);
      tl.to(ID + ' .asym-2', { opacity: 0.9, duration: 0.4 }, 7.0);
      tl.to(ID + ' .asym-lbl-2', { opacity: 0.95, duration: 0.35 }, 7.3);

      // 7.4 - 10.0s: tan curve draws segment by segment
      tl.to(ID + ' .tan-seg-1', { strokeDashoffset: 0, duration: 1.1, ease: 'power1.inOut' }, 7.4);
      tl.to(ID + ' .inf-arrow', { opacity: 1, y: -6, duration: 0.5, ease: 'power2.out' }, 8.3);
      tl.to(ID + ' .tan-seg-2', { strokeDashoffset: 0, duration: 1.35, ease: 'power1.inOut' }, 8.3);
      tl.to(ID + ' .tan-seg-3', { strokeDashoffset: 0, duration: 1.0, ease: 'power1.inOut' }, 9.5);

      // 10.4 - 12.0: asymptote emphasis pulse
      tl.to(ID + ' .asym-1', { strokeWidth: 3.2, duration: 0.4, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 10.4);
      tl.to(ID + ' .asym-2', { strokeWidth: 3.2, duration: 0.4, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 10.7);
      tl.to(ID + ' .inf-arrow', { fill: '#fff5f5', duration: 0.4, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 10.6);

      // 12.0 - 13.2: final caption
      tl.fromTo(ID + ' .caption', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 1.0, ease: 'power3.out' }, 12.0);
      tl.to(ID + ' .cap-accent3', { scale: 1.15, transformOrigin: 'center center', duration: 0.45, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 13.0);

      // 13.4 - 14.0: gentle settle
      tl.to(ID + ' .bg-vignette', { opacity: 1.1, duration: 0.6 }, 13.4);

      window.__timelines["scene-06-2d4304"] = tl;
    </script>
  </div>
</template>
