    <svg class="stage" viewBox="0 0 1920 780" xmlns="http://www.w3.org/2000/svg">

          <text class="cm-lbl" x="240" y="210" fill="#c4b5fd" font-size="18" text-anchor="middle" opacity="0">2π</text>

        <!-- Helix path — sinusoidal core, drawn across 4 cycles.

        <path class="helix-path"

                 C 140 -140, 160 -60, 180 0
                 C 200 60, 220 140, 240 160

                 C 440 -180, 460 -180, 480 -160
                 C 500 -140, 520 -60, 540 0
                 C 560 60, 580 140, 600 160

                 C 740 -60, 760 -140, 780 -160

                 C 860 -140, 880 -60, 900 0
                 C 920 60, 940 140, 960 160

                 C 1040 140, 1060 60, 1080 0"
              fill="none" stroke="url(#s07-helix-grad)" stroke-width="4" stroke-linecap="round"
              stroke-dasharray="3400" stroke-dashoffset="3400"

        <!-- Moving trace dot along the helix -->
        <circle class="trace-dot" cx="0" cy="0" r="9" fill="#fbbf24" filter="url(#s07-strong)" opacity="0"/>

        <!-- Annotations -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = '#scene-07-0d91b0';

      // 0 - 1.3s: atmosphere + title
      tl.fromTo(ID + ' .bg', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0);
      tl.fromTo(ID + ' .grid-floor', { opacity: 0 }, { opacity: 1, duration: 1.3, ease: 'power2.out' }, 0.1);
      tl.fromTo(ID + ' .eyebrow', { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power2.out' }, 0.25);
      tl.fromTo(ID + ' .title', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.45);
      tl.fromTo(ID + ' .subtitle', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 0.95);

      // 1.1 - 1.6s: readout panel slides in
      tl.fromTo(ID + ' .readout', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 1.1);

      // 1.4 - 3.0s: left panel setup + ellipse draws
      tl.fromTo(ID + ' .ax-h', { opacity: 0 }, { opacity: 0.55, duration: 0.5 }, 1.5);
      tl.fromTo(ID + ' .ax-v', { opacity: 0 }, { opacity: 0.55, duration: 0.5 }, 1.6);
      tl.to(ID + ' .unit-ellipse', { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, 1.7);
      tl.to(ID + ' .label-o', { opacity: 1, duration: 0.35 }, 2.6);
      tl.to(ID + ' .anchor', { opacity: 1, duration: 0.35, stagger: 0.08 }, 2.7);
      tl.to(ID + ' .anc-lbl', { opacity: 0.9, duration: 0.35, stagger: 0.08 }, 2.85);
      tl.to(ID + ' .label-circ', { opacity: 1, duration: 0.4 }, 3.2);

      // 3.0 - 3.5s: time axis extends
      tl.to(ID + ' .time-axis', { attr: { x2: 1140 }, duration: 1.1, ease: 'power2.out' }, 3.0);
      tl.to(ID + ' .time-arrow', { opacity: 1, duration: 0.35 }, 4.05);
      tl.to(ID + ' .time-label', { opacity: 1, duration: 0.4 }, 4.15);

      // 3.6 - 4.2s: rotor point reveals
      tl.to(ID + ' .radius', { opacity: 1, duration: 0.4 }, 3.5);
      tl.to(ID + ' .point-halo', { opacity: 1, duration: 0.5 }, 3.6);
      tl.to(ID + ' .point', { opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 3.7);

      // 4.0 - 11.2s: drive rotation — 4 full revolutions over ~7s; update cycle counter + phase;
      // simultaneously trace dot glides across helix and helix path draws in.
      const state = { a: 0 };
      const R = 220;
      tl.to(state, {
        a: -Math.PI * 8, // 4 full revolutions
        duration: 7.2,
        ease: 'none',
        onUpdate: () => {
          const t = state.a;
          const cx = Math.cos(t) * R;
          // elliptical y: tilt the circle — ellipse ratio 88/220 ≈ 0.4
          const cy = Math.sin(t) * 88;
          // update rotor transform
          const rotor = document.querySelector(ID + ' .rotor');
          if (rotor) {
            rotor.setAttribute('transform',
              'matrix(' + Math.cos(t) + ' ' + (-0.4 * Math.sin(t)) + ' ' +
              (-Math.sin(t)) + ' ' + (-0.4 * Math.cos(t)) + ' 0 0)');
          }

          // cycle progress (0..1 over the 4 revolutions)
          const progress = Math.min(1, Math.abs(t) / (Math.PI * 8));
          const n = Math.floor(Math.abs(t) / (Math.PI * 2));
          const phase = (Math.abs(t) / (Math.PI * 2)) * 2 * Math.PI;

          // trace dot follows helix across the panel; cycle span 240px
          const dx = progress * 1080;
          // sin wave relative to cycle position
          const local = (Math.abs(t) % (Math.PI * 2));
          const dy = -Math.sin(local) * 160;
          const dot = document.querySelector(ID + ' .trace-dot');
          if (dot) { dot.setAttribute('cx', dx.toFixed(2)); dot.setAttribute('cy', dy.toFixed(2)); }

          const cval = document.querySelector(ID + ' .cycle-val');
          if (cval) cval.textContent = n.toString();
          const pval = document.querySelector(ID + ' .phase-val');
          if (pval) pval.textContent = phase.toFixed(2);
        }
      }, 4.0);

      tl.to(ID + ' .trace-dot', { opacity: 1, duration: 0.4 }, 4.0);

      // helix draws in sync
      tl.to(ID + ' .helix-path', { strokeDashoffset: 0, duration: 6.8, ease: 'power1.inOut' }, 4.2);

      // cycle markers ignite as each cycle completes
      tl.to(ID + ' .cm-1', { opacity: 0.75, duration: 0.4 }, 5.5);
      tl.to(ID + ' .cycle-markers text:nth-of-type(1)', { opacity: 0.95, duration: 0.35 }, 5.7);
      tl.to(ID + ' .cm-2', { opacity: 0.75, duration: 0.4 }, 7.3);
      tl.to(ID + ' .cycle-markers text:nth-of-type(2)', { opacity: 0.95, duration: 0.35 }, 7.5);
      tl.to(ID + ' .cm-3', { opacity: 0.75, duration: 0.4 }, 9.0);
      tl.to(ID + ' .cycle-markers text:nth-of-type(3)', { opacity: 0.95, duration: 0.35 }, 9.2);
      tl.to(ID + ' .cm-4', { opacity: 0.75, duration: 0.4 }, 10.6);
      tl.to(ID + ' .cycle-markers text:nth-of-type(4)', { opacity: 0.95, duration: 0.35 }, 10.8);

      // helix caption reveal near end
      tl.fromTo(ID + ' .helix-label', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 9.5);

      // 11.4 - 12.4s: final caption
      tl.fromTo(ID + ' .caption', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 11.4);

      // Gentle halo breathing on the rotor
      tl.to(ID + ' .point-halo', {
        scale: 1.3, transformOrigin: '50% 50%',
        duration: 1.2, yoyo: true, repeat: 4, ease: 'sine.inOut'
      }, 4.4);

      // 12.6 - 13.0 final settle
      tl.to(ID + ' .bg-vignette', { opacity: 1.1, duration: 0.5 }, 12.6);

      window.__timelines["scene-07-0d91b0"] = tl;
    </script>
