      gsap.set(r + '.grid-lines', { opacity: 0 });
      gsap.set([r + '.x-axis', r + '.y-axis'], { opacity: 0 });
      gsap.set([r + '.origin', r + '.origin-label', r + '.unit-tick'], { opacity: 0 });

      tl.to(r + '.main-title', { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' }, 0.45);
      tl.to(r + '.subtitle',   { opacity: 1, x: 0, duration: 0.9, ease: 'power3.out' }, 0.95);

      tl.to(r + '.grid-lines', { opacity: 0.18, duration: 0.7 }, 2.0);
      tl.to(r + '.x-axis',     { opacity: 1, duration: 0.8, ease: 'power2.out' }, 2.2);
      tl.to(r + '.y-axis',     { opacity: 1, duration: 0.8, ease: 'power2.out' }, 2.6);
      tl.to([r + '.origin', r + '.origin-label'], { opacity: 1, duration: 0.5 }, 3.2);
      tl.to(r + '.unit-tick',  { opacity: 1, duration: 0.5 }, 3.5);

      // ---- 4-6s: draw unit circle + radius label ----
      tl.to(r + '.unit-circle', { strokeDashoffset: 0, duration: 2.0, ease: 'power2.inOut' }, 4.0);
      tl.to(r + '.radius-hint', { opacity: 0.6, duration: 0.6 }, 5.2);
      tl.to(r + '.radius-label',{ opacity: 1,   duration: 0.6 }, 5.4);

      // ---- 6-10s: ray appears, then rotates to 60° ----

      tl.to(r + '.angle-arc',  { opacity: 1, duration: 0.5 }, 8.3);
      tl.to(r + '.angle-label',{ opacity: 1, duration: 0.5 }, 8.6);

      // ---- 9.8-11s: point on circle lands ----

      tl.to(r + '.point-glow', { opacity: 0.75, scale: 1, duration: 0.6 }, 9.8);
      // finite pulse: 3 cycles @ 1.4s = 4.2s total (10.6 -> 14.8)
      tl.to(r + '.point-glow', {
        scale: 1.8, opacity: 0,
        duration: 1.4, repeat: 2, ease: 'power2.out'
      }, 10.6);

      // ---- 10.8-12.5s: cos projection drops onto x-axis ----
      tl.to(r + '.cos-line',  { opacity: 1, scaleX: 1, duration: 0.8, ease: 'power2.out' }, 10.9);
      tl.to(r + '.cos-label', { opacity: 1, y: 0,     duration: 0.5 }, 11.5);

      // ---- 11.8-13s: sin projection rises ----
