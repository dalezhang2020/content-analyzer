<!-- Reusable feature card. Driven by data-variable-values on each host. -->
<template id="feature-card-template">
  <div data-composition-id="feature-card" data-width="560" data-height="720">
    <style>
      .fc-root {
        width: 560px;
        height: 720px;
        position: relative;
        font-family: "Inter", system-ui, sans-serif;
        color: #1c1917;
        background: #fafaf9;
        border: 1.5px solid #e7e5e4;
        border-radius: 28px;
        overflow: hidden;
        padding: 48px 44px 52px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .fc-root .fc-badge {
        align-self: flex-start;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #d97706;
        padding: 8px 14px;
        border: 1.5px solid #fcd34d;
        border-radius: 999px;
        background: #fffbeb;
      }
      .fc-root .fc-icon {
        margin-top: 40px;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: #1c1917;
        color: #fef3c7;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .fc-root .fc-title {
        margin-top: 32px;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }
      .fc-root .fc-body {
        margin-top: 20px;
        font-size: 22px;
        line-height: 1.45;
        color: #57534e;
        max-width: 100%;
      }
      .fc-root .fc-meter {
        margin-top: auto;
        padding-top: 40px;
      }
      .fc-root .fc-meter-label {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #44403c;
        margin-bottom: 12px;
        font-variant-numeric: tabular-nums;
      }
      .fc-root .fc-meter-track {
        height: 10px;
        background: #e7e5e4;
        border-radius: 999px;
        overflow: hidden;
      }
      .fc-root .fc-meter-fill {
        height: 100%;
        width: 0%;
        background: #d97706;
        border-radius: 999px;
        transform-origin: left center;
      }
      .fc-root .fc-accent {
        position: absolute;
        top: 0;
        left: 0;
        height: 6px;
        width: 100%;
        background: #d97706;
        transform-origin: left center;
      }
    </style>

    <div class="fc-root">
      <div class="fc-accent"></div>
      <div class="fc-badge"></div>
      <div class="fc-icon"></div>
      <h3 class="fc-title"></h3>
      <p class="fc-body"></p>
      <div class="fc-meter">
        <div class="fc-meter-label">
          <span>SIGNAL</span>
          <span class="fc-meter-value">0%</span>
        </div>
        <div class="fc-meter-track">
          <div class="fc-meter-fill"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        // Read per-instance variables from the host element's data-variable-values.
        // We deliberately do NOT call window.__hyperframes.getVariables() here —
        // that returns the ROOT composition's variables, not this sub-comp's
        // per-instance overrides.
        function readHostVars() {
          try {
            const scriptEl = document.currentScript;
            // Walk up from the script to find the instantiated host element
            // that carries data-variable-values (or data-composition-id === feature-card).
            let node = scriptEl && scriptEl.parentElement;
            while (node) {
              if (node.dataset && node.dataset.variableValues) {
                return JSON.parse(node.dataset.variableValues);
              }
              node = node.parentElement;
            }
          } catch (e) {}
          return {};
        }
        const vars = readHostVars();
        const root = document.currentScript.parentElement;
        const card = root.querySelector(".fc-root");

        card.querySelector(".fc-badge").textContent = vars.badge;
        card.querySelector(".fc-icon").textContent = vars.icon;
        card.querySelector(".fc-title").textContent = vars.title;
        card.querySelector(".fc-body").textContent = vars.body;
        card.querySelector(".fc-meter-value").textContent = vars.meter + "%";

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.from(card.querySelector(".fc-accent"), {
          scaleX: 0,
          duration: 0.55,
          ease: "expo.out",
        }, 0.05);

        tl.from(card.querySelector(".fc-badge"), {
          y: -20,
          opacity: 0,
          duration: 0.45,
          ease: "back.out(2)",
        }, 0.18);

        tl.from(card.querySelector(".fc-icon"), {
          scale: 0.6,
          opacity: 0,
          duration: 0.55,
          ease: "elastic.out(1, 0.6)",
        }, 0.28);

        tl.from(card.querySelector(".fc-title"), {
          y: 40,
          opacity: 0,
          duration: 0.55,
          ease: "power3.out",
        }, 0.42);

        tl.from(card.querySelector(".fc-body"), {
          y: 30,
          opacity: 0,
          duration: 0.5,
          ease: "power2.out",
        }, 0.58);

        const meterFill = card.querySelector(".fc-meter-fill");
        const meterValue = card.querySelector(".fc-meter-value");
        const target = Number(vars.meter) || 0;

        const counter = { v: 0 };
        tl.to(counter, {
          v: target,
          duration: 1.1,
          ease: "power2.out",
          onUpdate() {
            meterValue.textContent = Math.round(counter.v) + "%";
          },
        }, 0.75);

        tl.to(meterFill, {
          width: target + "%",
          duration: 1.1,
          ease: "power2.out",
        }, 0.75);

        window.__timelines["feature-card"] = tl;
      })();
    </script>
  </div>
</template>
