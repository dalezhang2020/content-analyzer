[project]
name = "content-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.9,<1",
    "youtube-transcript-api>=0.6,<1",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]
dev = ["pytest>=7,<9"]
full = ["google-api-python-client>=2,<3", "yt-dlp>=2024.1"]
llm = ["openai>=1,<2"]
vision = ["openai>=1.75,<2"]

[project.scripts]
analyze = "content_analyzer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
